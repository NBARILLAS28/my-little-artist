<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="0.55" stop-color="#3D5AFE"/>
      <stop offset="1" stop-color="#00B8D4"/>
    </linearGradient>
    <linearGradient id="pal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="1" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A237E" flood-opacity=".35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <!-- squircle base -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <circle cx="840" cy="220" r="260" fill="#fff" opacity=".08"/>
    <circle cx="180" cy="880" r="300" fill="#fff" opacity=".07"/>
    <rect x="100" y="100" width="824" height="330" fill="url(#shine)"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFEB3B">
    <path d="M250 255l14 38 38 14-38 14-14 38-14-38-38-14 38-14z"/>
    <path d="M790 700l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" fill="#fff"/>
    <path d="M820 300l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#fff"/>
  </g>
  <!-- palette -->
  <g filter="url(#sh)">
    <path d="M512 255c-170 0-300 112-300 262 0 150 118 252 258 252 62 0 80-30 62-66-20-40 6-82 56-82h74c70 0 108-40 108-100 0-150-110-266-258-266z" fill="url(#pal)" stroke="#fff" stroke-width="10"/>
  </g>
  <!-- thumb hole -->
  <ellipse cx="392" cy="645" rx="46" ry="38" fill="#5C6BC0" opacity=".9"/>
  <!-- paint dots -->
  <circle cx="318" cy="440" r="48" fill="#FF5252"/>
  <circle cx="318" cy="440" r="48" fill="url(#shine)"/>
  <circle cx="432" cy="350" r="48" fill="#FFAB00"/>
  <circle cx="570" cy="330" r="48" fill="#FFEA00"/>
  <circle cx="696" cy="395" r="48" fill="#00E676"/>
  <circle cx="730" cy="525" r="46" fill="#29B6F6"/>
  <circle cx="540" cy="452" r="40" fill="#E040FB"/>
  <!-- cute face on palette -->
  <g>
    <ellipse cx="500" cy="560" rx="17" ry="24" fill="#37474F"/>
    <ellipse cx="590" cy="560" rx="17" ry="24" fill="#37474F"/>
    <circle cx="506" cy="551" r="6" fill="#fff"/>
    <circle cx="596" cy="551" r="6" fill="#fff"/>
    <path d="M492 612c18 36 82 36 100 0" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="455" cy="608" rx="20" ry="12" fill="#FF8A80" opacity=".8"/>
    <ellipse cx="640" cy="608" rx="20" ry="12" fill="#FF8A80" opacity=".8"/>
  </g>
  <!-- paintbrush -->
  <g transform="translate(822 196) rotate(38)" filter="url(#sh)">
    <rect x="-24" y="-20" width="48" height="232" rx="24" fill="#FF7043"/>
    <rect x="-24" y="-20" width="48" height="232" rx="24" fill="url(#shine)"/>
    <rect x="-30" y="200" width="60" height="58" rx="8" fill="#CFD8DC"/>
    <rect x="-30" y="212" width="60" height="9" fill="#90A4AE"/>
    <rect x="-30" y="232" width="60" height="9" fill="#90A4AE"/>
    <path d="M-30 258h60c4 46-14 84-30 108-16-24-34-62-30-108z" fill="#FF1744"/>
    <path d="M-10 274c0 34 6 58 10 74 4-16 10-40 10-74z" fill="#FF8A80" opacity=".7"/>
  </g>
</svg>
