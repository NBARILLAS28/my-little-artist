<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>My Little Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' data: blob:; media-src 'self' data: blob:">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand" id="brand" title="My Little Artist">
      <div id="mascot" class="mascot" aria-hidden="true">
        <svg viewBox="0 0 64 86" xmlns="http://www.w3.org/2000/svg">
          <g class="arti">
            <path d="M19 24L32 3l13 21z" fill="#E64A19"/>
            <path d="M26 12l6-9 6 9z" fill="#FFAB91" opacity=".7"/>
            <rect x="17" y="22" width="30" height="52" rx="7" fill="#FF7043"/>
            <rect x="17" y="22" width="30" height="10" fill="#FF8A65"/>
            <rect x="17" y="56" width="30" height="8" fill="#FFF3E0"/>
            <path d="M17 44q-11 2-12 12M47 44q11-2 12-12" fill="none" stroke="#FF7043" stroke-width="5" stroke-linecap="round" class="arti-arm"/>
            <g class="arti-eyes"><ellipse cx="26" cy="41" rx="3.6" ry="5" fill="#263238"/><ellipse cx="38" cy="41" rx="3.6" ry="5" fill="#263238"/><circle cx="27.3" cy="39" r="1.3" fill="#fff"/><circle cx="39.3" cy="39" r="1.3" fill="#fff"/></g>
            <path d="M25 49q7 8 14 0" stroke="#263238" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <ellipse cx="22" cy="49" rx="3.2" ry="2" fill="#FF8A80" opacity=".85"/><ellipse cx="42" cy="49" rx="3.2" ry="2" fill="#FF8A80" opacity=".85"/>
            <ellipse cx="25" cy="76" rx="7" ry="3.5" fill="#37474F"/><ellipse cx="39" cy="76" rx="7" ry="3.5" fill="#37474F"/>
          </g>
        </svg>
      </div>
      <div class="wordmark" id="wordmark" aria-label="My Little Artist"></div>
    </div>

    <nav class="bar-group" id="bar-file"></nav>
    <nav class="bar-group" id="bar-edit"></nav>
    <nav class="bar-group" id="bar-view"></nav>
    <nav class="bar-group right" id="bar-system"></nav>
  </header>

  <div id="main">
    <aside id="tools" aria-label="Herramientas"></aside>

    <section id="stage">
      <div id="viewport">
        <div id="paper">
          <canvas id="cv-bg"></canvas>
          <canvas id="cv-draw"></canvas>
          <canvas id="cv-stroke"></canvas>
          <canvas id="cv-lines"></canvas>
          <canvas id="cv-over"></canvas>
          <div id="selbox" hidden></div>
          <textarea id="textbox" hidden rows="1" spellcheck="false"></textarea>
        </div>
      </div>
      <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
      <div id="statusbar"><span id="st-size"></span><span id="st-pos"></span></div>
    </section>

    <aside id="options" aria-label="Opciones">
      <section class="panel" id="p-size">
        <h3 data-i18n="optSize"></h3>
        <div class="size-row">
          <div class="size-preview"><span id="size-dot"></span></div>
          <input type="range" id="size" min="1" max="80" value="10">
          <output id="size-out">10</output>
        </div>
        <div class="size-quick" id="size-quick"></div>
        <h3 data-i18n="optOpacity"></h3>
        <div class="size-row">
          <input type="range" id="opacity" min="10" max="100" value="100">
          <output id="opacity-out">100%</output>
        </div>
      </section>

      <section class="panel" id="p-shape" hidden>
        <h3 data-i18n="optShape"></h3>
        <div class="seg" id="fill-seg"></div>
      </section>

      <section class="panel" id="p-text" hidden>
        <h3 data-i18n="optText"></h3>
        <select id="font-sel" aria-label="Font"></select>
        <div class="seg two"><button id="btn-bold" class="seg-btn"><b>B</b> <span data-i18n="bold"></span></button><button id="btn-italic" class="seg-btn"><i>I</i> <span data-i18n="italic"></span></button></div>
      </section>

      <section class="panel" id="p-stamp" hidden>
        <h3 data-i18n="optStamps"></h3>
        <div class="stamp-tabs" id="stamp-tabs"></div>
        <div class="stamp-grid" id="stamp-grid"></div>
      </section>

      <section class="panel" id="p-select" hidden>
        <h3 data-i18n="optSelection"></h3>
        <div class="sel-grid" id="sel-grid"></div>
      </section>

      <section class="panel" id="p-sym">
        <h3 data-i18n="optSym"></h3>
        <div class="sym-grid" id="sym-grid"></div>
      </section>

      <section class="panel" id="p-bg">
        <h3 data-i18n="optBackground"></h3>
        <div class="bg-grid" id="bg-grid"></div>
        <button class="wide-btn" id="btn-coloring"></button>
      </section>
    </aside>
  </div>

  <footer id="colorbar">
    <div class="current" id="current-colors" title="">
      <button class="cur cur-2" id="cur-2" aria-label="Segundo color"></button>
      <button class="cur cur-1" id="cur-1" aria-label="Color principal"></button>
      <button class="swap" id="btn-swap" aria-label="Swap">⇄</button>
    </div>
    <div class="palette" id="palette"></div>
    <div class="recent-wrap">
      <div class="recent" id="recent"></div>
      <label class="custom-color" id="custom-wrap" title="">
        <input type="color" id="custom-color" value="#ff4081">
        <span class="custom-ring"></span>
        <span class="custom-label" data-i18n="moreColors"></span>
      </label>
    </div>
  </footer>
</div>

<div id="modal-root"></div>
<canvas id="confetti"></canvas>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/bmp,image/webp" hidden>

<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="sounds.js"></script>
<script src="app.js"></script>
</body>
</html>
